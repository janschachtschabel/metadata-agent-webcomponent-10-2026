<!-- Plugin Layout Template -->
<!-- Compact sidebar layout for browser extension -->

<div class="layout-container layout-plugin" [style.background]="backgroundColor || null">
  
  <!-- ===== INPUT AREA (optional) ===== -->
  <app-input-area
    *ngIf="showInputArea"
    [userText]="userText"
    [sourceUrl]="sourceUrl"
    [nodeId]="nodeId"
    [inputMode]="inputMode"
    [isExtracting]="state?.isExtracting ?? false"
    [compact]="true"
    [showPageMode]="showPageMode"
    (userTextChange)="userTextChange.emit($event)"
    (sourceUrlChange)="sourceUrlChange.emit($event)"
    (nodeIdChange)="nodeIdChange.emit($event)"
    (startExtraction)="startExtraction.emit()"
    (startUrlExtraction)="startUrlExtraction.emit($event)"
    (startNodeIdExtraction)="startNodeIdExtraction.emit($event)"
    (inputModeChange)="inputModeChange.emit($event)"
    (reset)="reset.emit()"
    (reloadFromPage)="reloadFromPage.emit()"
    [screenshotEnabled]="screenshotEnabled"
    (screenshotToggle)="screenshotToggle.emit($event)">
  </app-input-area>

  <!-- ===== STATUS BAR (optional) ===== -->
  <app-status-bar
    *ngIf="showStatusBar && state?.totalFields"
    [state]="state"
    [contentTypes]="contentTypes"
    [readonly]="readonly"
    [compact]="true"
    (selectContentType)="selectContentType.emit($event)">
  </app-status-bar>

  <!-- ===== RUNNING EXTRACTION, ERROR, NOTICE (shared by all layouts) ===== -->
  <app-extraction-feedback
    [state]="state"
    [compact]="true"
    (cancel)="cancelExtraction.emit()"
    (dismissError)="dismissError.emit()"
    (dismissWarning)="dismissWarning.emit()">
  </app-extraction-feedback>

  <!-- ===== PREVIEW THUMBNAIL ===== -->
  <app-preview-thumbnail
    *ngIf="showPreview && state?.previewImageUrl"
    [imageUrl]="state!.previewImageUrl"
    [compact]="true">
  </app-preview-thumbnail>

  <!-- ===== FIELD GROUPS ===== -->
  <section class="fields-section" *ngIf="_displayGroups.length" [attr.aria-busy]="state?.isExtracting ? 'true' : null">
    <ng-container *ngFor="let group of _displayGroups; trackBy: trackByGroupId; let i = index">
      <div class="field-group"
           *ngIf="(flatGroups || (group.isCore && showCoreFields) || (!group.isCore && showSpecialFields)) && (!readonly || (_visibleFieldsMap.get(group.id)?.length ?? 0) > 0)">

        <app-group-header [group]="group" [collapsible]="groupCollapse" [controls]="_uid + '-g' + i">
          <span class="count">{{ _filledCountMap.get(group.id) ?? 0 }}/{{ _flatCountMap.get(group.id) ?? 0 }}</span>
        </app-group-header>

        <div class="group-fields"
             [id]="_uid + '-g' + i"
             [class.columns-2]="columns === 2"
             *ngIf="!(groupCollapse && group.collapsed)">
          <app-field
            *ngFor="let field of _visibleFieldsMap.get(group.id); trackBy: trackByFieldId"
            [field]="field"
            [readonly]="readonly"
            [highlightAi]="highlightAi"
            [entry]="_entryControls.get(field.fieldId) ?? null"
            (entryChange)="objectEntryChange.emit($event)"
            (valueChange)="fieldValueChange.emit({ fieldId: field.fieldId, value: $event })">
          </app-field>
        </div>
      </div>
    </ng-container>
  </section>

  <!-- ===== EMPTY STATE ===== -->
  <section class="empty-state" *ngIf="!state?.fieldGroups?.length && !state?.isExtracting">
    <mat-icon><app-svg-icon name="info_outline"></app-svg-icon></mat-icon>
    <p>{{ 'EMPTY_STATE.NO_DATA' | translate }}</p>
  </section>

  <!-- ===== FLOATING BAR (shared by all layouts) ===== -->
  <app-floating-bar
    *ngIf="showFloatingControls"
    [state]="state"
    [contentTypes]="contentTypes"
    [readonly]="readonly"
    [showContentType]="showContentType"
    [showContentTypeOnly]="showContentTypeOnly"
    [showLanguageSwitcher]="showLanguageSwitcher"
    [showSaveButton]="showSaveButton"
    [showUploadButton]="showUploadButton"
    [showResetButton]="showResetButton"
    [uploading]="uploading"
    [labelled]="true"
    saveLabel="CONTROLS.SUBMIT"
    saveIcon="cloud_upload"
    (selectContentType)="selectContentType.emit($event)"
    (save)="submit.emit()"
    (upload)="upload.emit()"
    (reset)="reset.emit()">
  </app-floating-bar>

</div>
