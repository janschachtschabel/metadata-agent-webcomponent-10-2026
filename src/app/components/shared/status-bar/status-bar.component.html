<!-- Shared Status Bar -->
<section class="status-bar" [class.compact]="compact">
  
  <app-content-type-menu
    class="content-type-selector"
    [state]="state"
    [contentTypes]="contentTypes"
    [readonly]="readonly"
    (selectContentType)="selectContentType.emit($event)">
  </app-content-type-menu>

  <!-- Field Stats -->
  <div class="field-stats">
    <span class="stat-badge">
      {{ 'PROGRESS.FIELDS' | translate }}: {{ state?.filledFields }}/{{ state?.totalFields }}
    </span>
    <span class="stat-badge required" 
          [class.complete]="_requiredStatus.filled === _requiredStatus.total">
      {{ 'PROGRESS.REQUIRED' | translate }}: {{ _requiredStatus.filled }}/{{ _requiredStatus.total }}
    </span>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar-wrapper">
    <mat-progress-bar
      mode="determinate"
      [value]="_progressPercent"
      [attr.aria-label]="'PROGRESS.FIELDS_FILLED' | translate">
    </mat-progress-bar>
    <mat-icon class="progress-icon" [class.complete]="_progressPercent === 100">
      {{ _progressPercent === 100 ? 'check_circle' : 'hourglass_empty' }}
    </mat-icon>
  </div>

</section>
