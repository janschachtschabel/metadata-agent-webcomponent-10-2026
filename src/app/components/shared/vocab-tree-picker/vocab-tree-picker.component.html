<!-- Vocabulary Tree Picker - Hierarchical selection with search -->
<div class="vocab-tree-picker" *ngIf="open">
  <div class="picker-backdrop" (click)="close()" aria-hidden="true"></div>

  <!-- Modal: focus stays inside until it closes (Escape, close button, backdrop) -->
  <div class="picker-panel"
       [ngStyle]="panelStyle"
       [attr.id]="panelId"
       role="dialog"
       aria-modal="true"
       [attr.aria-label]="label || null"
       cdkTrapFocus
       (keydown.escape)="close(); $event.stopPropagation()">
    <!-- Header: Search + Close -->
    <div class="picker-header">
      <mat-form-field appearance="outline" class="filter-field" subscriptSizing="dynamic">
        <mat-label>{{ 'FIELD.VOCAB_FILTER' | translate }}</mat-label>
        <mat-icon matPrefix aria-hidden="true">search</mat-icon>
        <input matInput
               #filterInput
               [(ngModel)]="filterText"
               (ngModelChange)="onFilterChange()"
               autocomplete="off">
        <button *ngIf="filterText" type="button" matIconSuffix mat-icon-button (click)="clearFilter()"
                [attr.aria-label]="'FIELD.VOCAB_CLEAR_FILTER' | translate">
          <mat-icon aria-hidden="true">close</mat-icon>
        </button>
      </mat-form-field>
      <button class="close-btn" type="button" mat-icon-button (click)="close()"
              [attr.aria-label]="'COMMON.CLOSE' | translate">
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </div>

    <!-- Tree List: a group of checkboxes (a listbox may not contain controls) -->
    <div class="tree-list" role="group" [attr.aria-label]="label || null">
      <div *ngFor="let node of flatVisibleNodes; trackBy: trackByUri"
           class="tree-node"
           [class.depth-0]="node.depth === 0"
           [class.depth-1]="node.depth === 1"
           [class.depth-2]="node.depth === 2"
           [class.depth-3]="node.depth >= 3"
           [class.has-children]="node.children.length > 0"
           [class.selected]="isSelected(node)"
           [class.filter-match]="node.matchesFilter"
           [style.padding-left.px]="16 + node.depth * 24">

        <!-- Expand/Collapse Arrow -->
        <button *ngIf="node.children.length > 0"
                type="button"
                class="expand-btn"
                (click)="toggleExpand(node, $event)"
                [attr.aria-expanded]="node.expanded"
                [attr.aria-label]="(node.expanded ? 'FIELD.VOCAB_COLLAPSE' : 'FIELD.VOCAB_EXPAND') | translate">
          <mat-icon aria-hidden="true">{{ node.expanded ? 'expand_more' : 'chevron_right' }}</mat-icon>
        </button>
        <span *ngIf="node.children.length === 0" class="expand-spacer"></span>

        <!-- Checkbox + Label -->
        <mat-checkbox
          [checked]="isSelected(node)"
          (change)="toggleSelection(node)"
          color="primary"
          class="node-checkbox">
          <span class="node-label" [class.bold]="node.children.length > 0 && node.depth === 0">
            {{ node.concept.label }}
          </span>
        </mat-checkbox>
      </div>

      <!-- Empty state -->
      <div *ngIf="flatVisibleNodes.length === 0" class="empty-state">
        {{ 'FIELD.VOCAB_NO_RESULTS' | translate }}
      </div>
    </div>
  </div>
</div>
