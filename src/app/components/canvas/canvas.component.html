<!-- Canvas Component - Orchestrator -->
<!-- Delegates rendering to the active layout component, created in code with
     one list of bindings for all layouts (canvas.component.ts, layout-host.ts).
     It is created in ngOnInit, after all @Input setters have fired (anti-flicker). -->

<!-- Messages and questions to the editor (instead of alert/confirm) -->
<app-widget-notice [notice]="notice" (closed)="onNoticeClosed($event)"></app-widget-notice>

<ng-container #layoutHost></ng-container>
