# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection

# The widget had no build and no test job at all — a change that did not compile
# reached the backend's static/widget/dist by hand and was noticed there.
#
# `ng test` guards the rule that broke the staging index: an object-typed field
# must be treated as an object because the SCHEMA says so, never because the
# value happens to already be one. Deciding it from the value meant the canvas
# rendered a plain text input for schema:contactPoint, an editor typed a name
# into it, and that string fixed the Elasticsearch path to `text`.
#
# The build runs in the same job: specs that pass in a bundle that does not
# compile are worth nothing, and this is also the artifact that gets deployed.
widget build and tests:
  stage: test
  interruptible: true
  image: node:22.20.0-bookworm
  cache:
    key:
      files:
      - package-lock.json
    paths:
    - .npm
  before_script:
  # Karma needs a real browser. ChromeHeadlessCI in karma.conf.js adds the
  # --no-sandbox flag a container requires. The image is pinned to a Node
  # release (not `node:22`, which moves); Chromium comes from the Debian
  # bookworm archive of that image and is not pinned further - a digest pin of
  # the image would freeze it as well (debt, see CHANGELOG 3.0.0).
  - apt-get update -qq && apt-get install -y -qq chromium
  - export CHROME_BIN=$(which chromium)
  - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
  # Known vulnerabilities in what ships in the bundle (audit DEP-02); the dev
  # tools only run here and are left out.
  - npm audit --omit=dev --audit-level=high
  # --code-coverage: the coverage floor in karma.conf.js only applies to a run
  # that collects coverage.
  - npx ng test --watch=false --browsers=ChromeHeadlessCI --code-coverage
  # The production build is also the size check (audit 14.11., U-18/U-20): it
  # fails when the initial bundle exceeds the error budget of angular.json
  # (1.6 MB; 1.27 MB on 2026-11-14) and warns above 1.4 MB. Its type-check is
  # tsconfig.app.json - main.ts and what it reaches, without the specs.
  - npx ng build --configuration production
  # The deploy step's guards, into a scratch target: only the three bundles as
  # JavaScript in dist/, no host outside the allow-list in them, the texts of
  # de.json/en.json inside main.js, every font the stylesheet loads present.
  # It also writes elements-check/dist/build.json - widget version, build time
  # and a SHA-256 of every delivered file and over all of them.
  - mkdir -p elements-check && node scripts/build-elements.js --target=elements-check
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
    - dist/
    - elements-check/

# How the copy of the bundle in the agent's repository is checked against a
# build (audit 14.11., U-17/U-20). The job itself belongs to the agent's
# pipeline - that repository holds the files. Two checks:
#
# 1. The files are one complete delivery of build-elements.js: recompute
#    build.json from src/static/widget (dist/ and assets/i18n/, without
#    build.json itself). Per file the SHA-256; `hash` is the SHA-256 of the
#    lines "<sha256>  <path>\n" in the order of the paths, i.e. of the output
#    of `sha256sum`. A bundle edited by hand, copied in part, mixed from two
#    builds or with a file too many or too few does not match:
#
#      cd src/static/widget && python - <<'PY'
#      import hashlib, json, pathlib, sys
#      stamp = json.loads(pathlib.Path("dist/build.json").read_text(encoding="utf-8"))
#      found = {p.as_posix() for d in ("dist", "assets/i18n") for p in pathlib.Path(d).rglob("*") if p.is_file()} - {"dist/build.json"}
#      sums = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sorted(found)}
#      total = hashlib.sha256("".join(f"{s}  {p}\n" for p, s in sums.items()).encode()).hexdigest()
#      bad = sorted(p for p in found | set(stamp["files"]) if sums.get(p) != stamp["files"].get(p))
#      print("widget", stamp["version"], "built", stamp["builtAt"], "-", "matches build.json" if not bad and total == stamp["hash"] else "DIFFERS: " + ", ".join(bad or ["hash"]))
#      sys.exit(1 if bad or total != stamp["hash"] else 0)
#      PY
#
# 2. It is the build of a known pipeline of this repository: compare `hash`
#    (and `version`) of the agent's dist/build.json with
#    elements-check/dist/build.json from the artifacts of the job above.
#    `builtAt` and the two hashes of a build made elsewhere from the same
#    commit are not expected to be equal - compare with the artifact that was
#    delivered, not with a rebuild.

# ESLint with angular-eslint: the recommended rules for TypeScript and
# templates and the template accessibility rules (audit 14.11., U-19/U-20).
# Blocking. Errors only - rules the code does not meet yet are warnings or
# off, each with its reason, in eslint.config.js.
lint:
  stage: test
  interruptible: true
  image: node:22.20.0-bookworm
  needs: []
  cache:
    key:
      files:
      - package-lock.json
    paths:
    - .npm
  script:
  - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  - npm run lint

# The dev tools (Karma, webpack-dev-server, the Angular build chain, ESLint)
# run here and on developer machines, so their advisories matter too (audit
# DEP-03).
#
# State of 2026-11-14 (audit U-10): after `npm audit fix` and an `npm update`
# within the ranges of package.json (Angular 21.2.25 -> 21.2.26,
# build-angular -> 21.2.30; lockfile only) no advisory of level high is left;
# before it there were 30 (1 low, 22 moderate, 7 high). None of them was in
# braces or karma - the reason this comment gave until then described a state
# that was gone.
#
# Blocking at `high`. The 25 moderate ones that were left came from two
# advisories (glob 13 below pacote in @angular/cli, minimatch 10 below
# typescript-eslint); `overrides` in package.json lift exactly those to the
# fixed versions, so the run is clean (0 advisories). Remove the overrides
# once @angular/cli and typescript-eslint ask for the fixed versions
# themselves. The shipped bundle is guarded by the --omit=dev audit above.
audit dev dependencies:
  stage: test
  interruptible: true
  image: node:22.20.0-bookworm
  needs: []
  script:
  - npm audit --audit-level=high

sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
